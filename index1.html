<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Chart Viewer</title>
<!-- Keep these 2 files in the same folder as this page -->
<link rel="stylesheet" href="visuals_v1.css">
<link rel="stylesheet" href="side-menu_v1.css">
<style>
/* ===== Stock Chart Viewer: only what the 2 shared CSS files don't already cover ===== */
html,body{height:100%}
.app{height:100vh;overflow:hidden}
.content{display:flex;flex-direction:column;overflow:hidden}
@media(min-width:701px){.content{height:calc(100vh - 12px);min-height:0}}
.viewer{flex:1;min-height:0;display:flex;flex-direction:column;padding:18px 20px 16px}
.viewer .topline{margin-bottom:12px;align-items:center}
.viewer .topline .sub{margin-top:1px}
.split{flex:1;min-height:0;display:flex;gap:12px}
.tablepane{flex:0 0 min(800px,54%);min-height:0;height:auto;max-height:100%;align-self:flex-start}
.chartpane{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:0 1px 3px rgba(0,0,0,.2);overflow:hidden}
#single-chart-panel{flex:1;min-height:0;display:flex}
.tradingview-widget-container{flex:1;min-height:0}
.multi-chart-panel{flex:1;min-height:0;overflow:auto;display:none;padding:10px}
.multi-group-title{margin:0 0 6px;font-size:12px;font-weight:600;color:var(--muted)}
.multi-chart-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

/* legend chips (Industries sectors) */
.legend{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:6px}
.legend-item{padding:2px 7px;border-radius:6px;font-size:10px;font-weight:600;color:#fff;user-select:none}
.legend:empty{display:none}

/* table tweaks for this data */
.ticker-table{min-width:0}
.ticker-table th:nth-child(2),.ticker-table td:nth-child(2){text-align:center}
.ticker-table th:last-child,.ticker-table td:last-child{text-align:left}
.ticker-table th.sortable:hover{color:var(--text)}
.ticker-table th.sort-asc::after{content:" ↑"}
.ticker-table th.sort-desc::after{content:" ↓"}
.ticker-table th.sorted-column{color:var(--text);background:color-mix(in srgb,var(--accent-ui) 14%,var(--th))}
.ticker-table td.sorted-column{background:rgba(255,255,255,.03)}
.ticker-row{cursor:pointer}
.ticker-row.active,.ticker-row.active:hover{background:color-mix(in srgb,var(--accent-ui) 13%,transparent)}
.ticker-table td.price-up{color:var(--green);font-weight:500}
.ticker-table td.price-down{color:var(--red);font-weight:500}
.ticker-label{display:inline-block;font-weight:700;color:var(--ticker)}
.ticker-label[class*="ticker-label-"]{padding:2px 8px;border-radius:12px;font-size:11px;color:#fff;background:#4a5568}
.abc-rating{display:inline-block;width:18px;height:18px;border-radius:50%;text-align:center;line-height:18px;font-size:11px;font-weight:700;color:#0a0a0a}
.abc-a{background:var(--blue)}.abc-b{background:var(--green)}.abc-c{background:var(--amber)}
.value-visualization{position:relative;display:inline-block;padding:2px 6px;border-radius:3px;min-width:52px;max-width:100%;text-align:right}
.value-bar{position:absolute;top:0;height:100%;border-radius:3px;opacity:.22;z-index:0;max-width:100%}
.value-bar.positive{background:var(--green);left:0}
.value-bar.negative{background:var(--red);right:0}
.value-text{position:relative;z-index:1}
.rs-chart{display:block;height:22px;max-width:90px;object-fit:contain}
.etf-list{font-size:11px}
.long-etf{color:var(--green);cursor:pointer}
.short-etf{color:var(--red);cursor:pointer}
.long-etf:hover,.short-etf:hover{text-decoration:underline}
.loading-msg{padding:24px;text-align:center;color:var(--muted)}

/* economic calendar pop-up */
.econ-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:9999}
.econ-modal{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px 10px 6px;width:440px;max-width:94vw;max-height:92vh;box-shadow:0 10px 30px rgba(0,0,0,.7)}
.econ-modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;font-size:13px;font-weight:600}
.econ-modal-close{background:transparent;border:0;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:0 2px}
.econ-modal-close:hover{color:var(--text)}
.econ-modal a{color:var(--muted);font-size:11px}

/* phone: stack table over chart */
@media(max-width:700px){
  .app{overflow:auto}
  .viewer{padding:14px 12px}
  .split{flex-direction:column}
  .tablepane{flex:0 0 auto;max-height:55vh;align-self:stretch}
  .chartpane{flex:0 0 60vh}
  .multi-chart-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">

  <!-- ===== side menu: Economic Calendar + one tab per table group (built from the data) ===== -->
  <aside class="side" id="side">
    <div class="pin">
      <div class="pin-top">
        <button class="item" id="collapse" title="Collapse menu">
          <svg class="ic cl-x" viewBox="0 0 24 24"><path d="M5 5v14"/><path d="M18 6l-6 6 6 6"/></svg>
          <svg class="ic cl-e" viewBox="0 0 24 24"><path d="M19 5v14"/><path d="M6 6l6 6-6 6"/></svg>
        </button>
        <div class="side-logo"><span>stock<span class="pls">viewer</span></span>
          <svg class="pico" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg></div>
      </div>
    </div>
    <div class="top">
      <button class="item" type="button" id="calBtn" title="Economic Calendar">
        <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg>
        <span class="lb">Economic Calendar</span>
      </button>
    </div>
    <nav id="menu"></nav>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="content">
    <main class="page viewer">
      <div class="topline">
        <div>
          <h1 id="title">Loading…</h1>
          <div class="sub">↑ ↓ arrow keys to navigate · Data auto-refreshed daily via GitHub Actions · Yahoo Finance</div>
          <div class="legend" id="legend"></div>
        </div>
        <div class="controls">
          <button class="menuBtn" id="menuBtn" aria-label="Open menu">&#9776;</button>
          <span class="wadd"><button type="button" id="multiBtn">MultiChart</button></span>
        </div>
      </div>

      <div class="split">
        <section class="tablewrap tablepane" id="tablepane"><div id="groups-container"><div class="loading-msg">LOADING DATA...</div></div></section>
        <section class="chartpane">
          <div id="single-chart-panel">
            <div class="tradingview-widget-container"><div id="tradingview-chart" style="height:100%;width:100%;"></div></div>
          </div>
          <div id="multi-chart-panel" class="multi-chart-panel"></div>
        </section>
      </div>
    </main>
  </div>
</div>

<div id="economic-calendar-modal-overlay" class="econ-modal-overlay" onclick="closeEconomicCalendar(event)">
  <div class="econ-modal" onclick="event.stopPropagation()">
    <div class="econ-modal-header">
      <span>Economic Calendar</span>
      <button type="button" class="econ-modal-close" onclick="closeEconomicCalendar(event)">×</button>
    </div>
    <!-- TradingView Widget BEGIN -->
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <div class="tradingview-widget-copyright">
        <a href="https://www.tradingview.com/economic-calendar/" rel="noopener nofollow" target="_blank"><span class="blue-text">Economic Calendar</span></a>
        <span class="trademark"> by TradingView</span>
      </div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-events.js" async>
      {
      "colorTheme": "dark",
      "isTransparent": false,
      "locale": "en",
      "countryFilter": "us",
      "importanceFilter": "-1,0,1",
      "width": 400,
      "height": 550
      }
      </script>
    </div>
    <!-- TradingView Widget END -->
  </div>
</div>

<script src="https://s3.tradingview.com/tv.js"></script>
<script>
(function() {
    var GROUP_ORDER = ['Indices', 'S&P Style ETFs', 'Sel Sectors', 'EW Sectors', 'Industries', 'Countries'];
    var CHART_BG = '#161616';            /* matches the card color */
    var ICONS = {
        'Indices':        '<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
        'S&P Style ETFs': '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',
        'Sel Sectors':    '<path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/>',
        'EW Sectors':     '<path d="M6 20V10"/><path d="M12 20V4"/><path d="M18 20v-7"/>',
        'Industries':     '<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
        'Countries':      '<circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18"/>'
    };
    var ICON_DEFAULT = '<circle cx="6" cy="6" r="1.5"/><circle cx="12" cy="6" r="1.5"/><circle cx="18" cy="6" r="1.5"/><circle cx="6" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="18" cy="12" r="1.5"/>';

    var chartWidget = null, currentIndex = 0, allTickerRows = [];
    var snapshot = null, meta = null, multiChartMode = false, defaultSymbol = 'QQQE';
    var currentGroup = null, sortState = null, groupNames = [];

    function escapeHtml(s) {
        if (!s) return '';
        return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    function vizWidth(value, minVal, maxVal) {
        if (value == null || minVal >= maxVal) return 0;
        if (value >= 0) return maxVal <= 0 ? 0 : Math.min(100, Math.max(0, (value / maxVal) * 100));
        return minVal >= 0 ? 0 : Math.min(100, Math.max(0, (Math.abs(value) / Math.abs(minVal)) * 100));
    }
    function getLabelClass(groupName, ticker) {
        return (groupName === 'Industries' && meta && meta.Industries_COLORS && meta.Industries_COLORS[ticker]) ? ' ticker-label-' + ticker : '';
    }

    /* ---------- side menu tabs (one per group, in the order of the data) ---------- */
    function buildMenu() {
        var groups = snapshot && snapshot.groups ? snapshot.groups : {};
        groupNames = GROUP_ORDER.filter(function(n) { return groups[n] && groups[n].length; });
        Object.keys(groups).forEach(function(n) { if (groupNames.indexOf(n) < 0 && groups[n] && groups[n].length) groupNames.push(n); });
        var menu = document.getElementById('menu');
        menu.innerHTML = groupNames.map(function(n) {
            return '<button class="item" type="button" data-group="' + escapeHtml(n) + '" title="' + escapeHtml(n) + '">' +
                '<svg class="ic" viewBox="0 0 24 24">' + (ICONS[n] || ICON_DEFAULT) + '</svg><span class="lb">' + escapeHtml(n) + '</span></button>';
        }).join('');
        menu.onclick = function(e) {
            var b = e.target.closest('.item[data-group]');
            if (!b) return;
            selectGroup(b.getAttribute('data-group'));
            document.getElementById('side').classList.remove('open');
        };
    }

    /* ---------- one table for the selected tab ---------- */
    function renderTable(groupName) {
        var rows = snapshot.groups[groupName] || [];
        var ranges = (snapshot.column_ranges && snapshot.column_ranges[groupName]) || { daily: [-10,10], intra: [-10,10], '5d': [-20,20], '20d': [-30,30] };
        var html = '<table class="ticker-table" data-group="' + escapeHtml(groupName) + '"><thead><tr>';
        var th = function(key, label) { return '<th class="sortable" data-sort-by="' + key + '" title="Click to sort">' + label + '</th>'; };
        html += th('symbol', 'Ticker') + th('abc', 'Grade') + th('daily', 'Daily') + th('intra', 'Intra') + th('5d', '5D') + th('20d', '20D') +
                th('atr_pct', 'ATR%') + th('dist_sma50_atr', 'ATRx') + th('rs', '1M-VARS') + th('rs', 'VARS') + th('letf', 'LETF');
        html += '</tr></thead><tbody>';
        function cell(v, rng) {
            if (v == null) return '<td>N/A</td>';
            var cl = v > 0 ? 'price-up' : (v < 0 ? 'price-down' : '');
            return '<td class="' + cl + '"><div class="value-visualization"><div class="value-bar ' + (v >= 0 ? 'positive' : 'negative') + '" style="width:' +
                   vizWidth(v, rng[0], rng[1]) + '%"></div><span class="value-text">' + (v >= 0 ? '+' : '') + v.toFixed(2) + '%</span></div></td>';
        }
        for (var i = 0; i < rows.length; i++) {
            var r = rows[i];
            var letf = (r.long && r.long.length) || (r.short && r.short.length) ? '1' : '0';
            var abc = r.abc || '';
            html += '<tr class="ticker-row" onclick="updateChart(\'' + r.ticker + '\', this)" data-symbol="' + r.ticker + '"' +
                ' data-daily="' + (r.daily != null ? r.daily : 0) + '" data-intra="' + (r.intra != null ? r.intra : 0) + '"' +
                ' data-5d="' + (r['5d'] != null ? r['5d'] : 0) + '" data-20d="' + (r['20d'] != null ? r['20d'] : 0) + '"' +
                ' data-atr_pct="' + (r.atr_pct != null ? r.atr_pct : 0) + '" data-dist_sma50_atr="' + (r.dist_sma50_atr != null ? r.dist_sma50_atr : 0) + '"' +
                ' data-rs="' + (r.rs != null ? r.rs : 0) + '" data-abc="' + abc + '" data-letf="' + letf + '" data-index="' + i + '">';
            html += '<td><span class="ticker-label' + getLabelClass(groupName, r.ticker) + '">' + r.ticker + '</span></td>';
            html += '<td>' + (abc ? '<span class="abc-rating abc-' + abc.toLowerCase() + '">' + abc + '</span>' : '-') + '</td>';
            html += cell(r.daily, ranges.daily) + cell(r.intra, ranges.intra) + cell(r['5d'], ranges['5d']) + cell(r['20d'], ranges['20d']);
            html += '<td>' + (r.atr_pct != null ? r.atr_pct.toFixed(1) + '%' : 'N/A') + '</td>';
            html += '<td>' + (r.dist_sma50_atr != null ? r.dist_sma50_atr.toFixed(2) : 'N/A') + '</td>';
            html += '<td>' + (r.rs != null ? Math.round(r.rs) + '%' : 'N/A') + '</td>';
            html += '<td>' + (r.rs_chart ? '<img src="' + r.rs_chart + '" class="rs-chart" alt="RS">' : 'N/A') + '</td>';
            html += '<td class="etf-list">';
            if (r.long && r.long.length) html += r.long.map(function(e) { return '<span class="long-etf" onclick="event.stopPropagation();updateChart(\'' + e + '\')">' + e + '</span>'; }).join(', ');
            if (r.short && r.short.length) { if (r.long && r.long.length) html += '<br>'; html += r.short.map(function(e) { return '<span class="short-etf" onclick="event.stopPropagation();updateChart(\'' + e + '\')">' + e + '</span>'; }).join(', '); }
            if (!(r.long && r.long.length) && !(r.short && r.short.length)) html += '-';
            html += '</td></tr>';
        }
        document.getElementById('groups-container').innerHTML = html + '</tbody></table>';
    }

    function renderLegend(groupName) {
        var el = document.getElementById('legend');
        var html = '';
        if (groupName === 'Industries' && meta && meta.SECTOR_COLORS)
            for (var s in meta.SECTOR_COLORS) html += '<span class="legend-item" style="background-color:' + meta.SECTOR_COLORS[s] + '">' + s + '</span>';
        el.innerHTML = html;
    }

    function injectIndustryColors() {
        if (!meta || !meta.Industries_COLORS) return;
        var style = document.createElement('style'), css = '';
        for (var t in meta.Industries_COLORS) css += '.ticker-label.ticker-label-' + t + '{background-color:' + meta.Industries_COLORS[t] + ';color:#fff} ';
        style.textContent = css;
        document.head.appendChild(style);
    }

    function selectGroup(groupName, preferSymbol) {
        if (!snapshot || !snapshot.groups || !snapshot.groups[groupName]) return;
        currentGroup = groupName;
        sortState = { sortBy: null, direction: 1, count: 0 };
        document.querySelectorAll('#menu .item').forEach(function(b) { b.classList.toggle('on', b.getAttribute('data-group') === groupName); });
        document.getElementById('title').textContent = groupName;
        renderLegend(groupName);
        renderTable(groupName);
        document.getElementById('tablepane').scrollTop = 0;
        allTickerRows = [].slice.call(document.querySelectorAll('.ticker-row'));
        var start = null;
        if (preferSymbol) start = allTickerRows.filter(function(r) { return r.getAttribute('data-symbol') === preferSymbol; })[0];
        if (!start) start = allTickerRows[0];
        if (start) {
            start.classList.add('active');
            currentIndex = allTickerRows.indexOf(start);
            if (!multiChartMode) initChart(start.getAttribute('data-symbol'));
        }
        if (multiChartMode) buildMultiChart(groupName);
    }

    /* ---------- charts ---------- */
    function buildMultiChart(groupName) {
        var panel = document.getElementById('multi-chart-panel');
        panel.innerHTML = '';
        var rows = allTickerRows;
        if (!rows.length) return;
        var block = document.createElement('div');
        var title = document.createElement('div');
        title.className = 'multi-group-title';
        title.textContent = groupName;
        var grid = document.createElement('div');
        grid.className = 'multi-chart-grid';
        rows.forEach(function(row) {
            var sym = (row.getAttribute('data-symbol') || '').trim();
            if (!sym) return;
            var wrap = document.createElement('div');
            wrap.className = 'tradingview-widget-container';
            wrap.style.height = '325px';
            wrap.style.width = '100%';
            wrap.innerHTML = '<div class="tradingview-widget-container__widget" style="height:100%;width:100%;border:1px solid rgba(255,255,255,0.06);border-radius:4px;"></div>';
            var script = document.createElement('script');
            script.src = 'https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';
            script.async = true;
            script.textContent = JSON.stringify({
                "allow_symbol_change": true, "calendar": false, "details": false,
                "hide_side_toolbar": true, "hide_top_toolbar": false, "hide_legend": true, "hide_volume": true,
                "hotlist": false, "interval": "D", "locale": "en", "save_image": false, "style": "1",
                "symbol": sym, "theme": "dark", "timezone": "America/Toronto",
                "backgroundColor": CHART_BG, "gridColor": "rgba(242, 242, 242, 0.06)",
                "watchlist": [], "withdateranges": false, "compareSymbols": [],
                "studies": ["STD;MA%Ribbon"], "autosize": true
            });
            wrap.querySelector('.tradingview-widget-container__widget').appendChild(script);
            grid.appendChild(wrap);
        });
        block.appendChild(title);
        block.appendChild(grid);
        panel.appendChild(block);
    }

    function setMultiMode(on) {
        multiChartMode = on;
        document.getElementById('single-chart-panel').style.display = on ? 'none' : 'flex';
        document.getElementById('multi-chart-panel').style.display = on ? 'block' : 'none';
        document.getElementById('multiBtn').textContent = on ? 'SingleChart' : 'MultiChart';
        if (on) {
            if (chartWidget) { chartWidget.remove(); chartWidget = null; }
            buildMultiChart(currentGroup);
        } else {
            var active = document.querySelector('.ticker-row.active');
            initChart(active ? active.getAttribute('data-symbol') : defaultSymbol);
        }
    }

    function initChart(symbol) {
        if (chartWidget) { chartWidget.remove(); chartWidget = null; }
        chartWidget = new TradingView.widget({
            allow_symbol_change: true, calendar: false, details: true,
            hide_side_toolbar: false, hide_top_toolbar: false, hide_legend: false, hide_volume: false,
            hotlist: false, interval: 'D', locale: 'en', save_image: false, style: '1',
            symbol: symbol, theme: 'dark', timezone: 'America/Toronto',
            toolbar_bg: CHART_BG, backgroundColor: CHART_BG, gridColor: 'rgba(255,255,255,0.1)',
            watchlist: [], withdateranges: true, studies: ['STD;MA%Ribbon'],
            compareSymbols: [{ symbol: 'AMEX:SPY', position: 'NewPane' }],
            autosize: true, enable_publishing: false, container_id: 'tradingview-chart'
        });
    }

    window.updateChart = function(symbol, element) {
        allTickerRows.forEach(function(row) { row.classList.remove('active'); });
        var row = element || allTickerRows.filter(function(r) { return r.getAttribute('data-symbol') === symbol; })[0];
        if (row) { row.classList.add('active'); currentIndex = allTickerRows.indexOf(row); row.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
        if (!multiChartMode) initChart(symbol);
    };

    /* ---------- economic calendar pop-up ---------- */
    window.openEconomicCalendar = function() {
        var ov = document.getElementById('economic-calendar-modal-overlay');
        if (ov) ov.style.display = 'flex';
    };
    window.closeEconomicCalendar = function(ev) {
        if (ev) ev.preventDefault();
        var ov = document.getElementById('economic-calendar-modal-overlay');
        if (ov) ov.style.display = 'none';
    };

    /* ---------- sorting (click a column header: asc -> desc -> original order) ---------- */
    function sortTable(sortBy) {
        var table = document.querySelector('.ticker-table');
        if (!table) return;
        var tbody = table.querySelector('tbody');
        var rows = [].slice.call(tbody.querySelectorAll('.ticker-row'));
        var state = sortState;
        table.querySelectorAll('th, td').forEach(function(el) { el.classList.remove('sort-asc', 'sort-desc', 'sorted-column'); });

        if (state.sortBy === sortBy) {
            state.count++;
            if (state.count >= 3) {
                state.sortBy = null; state.direction = 1; state.count = 0;
                rows.sort(function(a, b) { return parseInt(a.getAttribute('data-index')) - parseInt(b.getAttribute('data-index')); });
                rows.forEach(function(r) { tbody.appendChild(r); });
                refreshRows(); return;
            }
        } else state.count = 1;
        state.sortBy = sortBy;
        if (state.count === 2) state.direction *= -1; else state.direction = 1;

        var colMap = { symbol: 0, abc: 1, daily: 2, intra: 3, '5d': 4, '20d': 5, atr_pct: 6, dist_sma50_atr: 7, rs: 8, letf: 10 };
        var hi = colMap[sortBy] !== undefined ? colMap[sortBy] : 9;
        var headerIndices = (sortBy === 'rs') ? [8, 9] : [hi];
        headerIndices.forEach(function(idx) {
            var h = table.querySelectorAll('th')[idx];
            if (h) h.classList.add(state.direction === 1 ? 'sort-asc' : 'sort-desc', 'sorted-column');
        });
        rows.forEach(function(row) {
            var cells = row.querySelectorAll('td');
            headerIndices.forEach(function(idx) { if (cells[idx]) cells[idx].classList.add('sorted-column'); });
        });

        var tickerToSector = (meta && meta.TICKER_TO_SECTOR) ? meta.TICKER_TO_SECTOR : {};
        var sectorOrder = (meta && meta.SECTOR_ORDER) ? meta.SECTOR_ORDER : [];
        function sectorIndex(s) { var i = sectorOrder.indexOf(s); return i >= 0 ? i : sectorOrder.length; }

        rows.sort(function(a, b) {
            if (sortBy === 'symbol') {
                var aT = a.getAttribute('data-symbol'), bT = b.getAttribute('data-symbol');
                if (currentGroup === 'Industries') {
                    var aS = tickerToSector[aT] || 'Unknown', bS = tickerToSector[bT] || 'Unknown';
                    if (sectorIndex(aS) !== sectorIndex(bS)) return (sectorIndex(aS) - sectorIndex(bS)) * state.direction;
                }
                return aT.toLowerCase().localeCompare(bT.toLowerCase()) * state.direction;
            } else if (sortBy === 'abc') {
                return (a.getAttribute('data-abc') || '').localeCompare(b.getAttribute('data-abc') || '') * state.direction;
            } else if (sortBy === 'letf') {
                return (parseInt(a.getAttribute('data-letf') || '0') - parseInt(b.getAttribute('data-letf') || '0')) * state.direction;
            }
            return (parseFloat(a.getAttribute('data-' + sortBy)) - parseFloat(b.getAttribute('data-' + sortBy))) * state.direction;
        });
        rows.forEach(function(r) { tbody.appendChild(r); });
        refreshRows();
    }
    function refreshRows() {
        allTickerRows = [].slice.call(document.querySelectorAll('.ticker-row'));
        var ar = document.querySelector('.ticker-row.active');
        if (ar) currentIndex = allTickerRows.indexOf(ar);
    }

    /* ---------- wiring ---------- */
    function wireUp() {
        document.getElementById('tablepane').addEventListener('click', function(ev) {
            var th = ev.target.closest('th.sortable');
            if (th) sortTable(th.getAttribute('data-sort-by'));
        });
        document.getElementById('calBtn').onclick = window.openEconomicCalendar;
        document.getElementById('multiBtn').onclick = function() { if (currentGroup) setMultiMode(!multiChartMode); };
        document.getElementById('collapse').onclick = function() { document.getElementById('side').classList.toggle('collapsed'); };
        document.getElementById('menuBtn').onclick = function() { document.getElementById('side').classList.add('open'); };
        document.getElementById('scrim').onclick = function() { document.getElementById('side').classList.remove('open'); };
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') window.closeEconomicCalendar();
            if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
            if (/INPUT|SELECT|TEXTAREA/.test((document.activeElement || {}).tagName || '')) return;
            e.preventDefault();
            var next = currentIndex + (e.key === 'ArrowDown' ? 1 : -1);
            if (next < 0 || next >= allTickerRows.length) return;
            updateChart(allTickerRows[next].getAttribute('data-symbol'), allTickerRows[next]);
        });
    }

    function loadData() {
        wireUp();
        Promise.all([
            fetch('data/snapshot.json').then(function(res) { return res.ok ? res.json() : null; }).catch(function() { return null; }),
            fetch('data/meta.json').then(function(res) { return res.ok ? res.json() : null; }).catch(function() { return null; })
        ]).then(function(results) {
            snapshot = results[0];
            meta = results[1];
            if (!snapshot || !snapshot.groups) {
                document.getElementById('title').textContent = 'Stock Chart Viewer';
                document.getElementById('groups-container').innerHTML = '<div class="loading-msg">LOADING DATA... (Run scripts/build_data.py or wait for GitHub Actions)</div>';
                return;
            }
            defaultSymbol = (meta && meta.default_symbol) ? meta.default_symbol : 'QQQE';
            injectIndustryColors();
            buildMenu();
            if (groupNames.length) selectGroup(groupNames[0], defaultSymbol);
        });
    }

    loadData();
})();
</script>
</body>
</html>
